<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- 卡片无边框柔和立体投影 -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <!-- 粒子辉光滤镜 -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 文字发光微投影（风格 C 未来机能体文字专用） -->
    <filter id="textHalo" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="3" flood-color="#ffffff" flood-opacity="0.98"/>
    </filter>

    <!-- Lightfall 垂直下落流光束渐变 -->
    <linearGradient id="streamCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset="65%" stop-color="#00f0ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="streamPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset="65%" stop-color="#a855f7" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="streamEmerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="65%" stop-color="#34d399" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#6ee7b7" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="streamPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0"/>
      <stop offset="65%" stop-color="#f472b6" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="streamAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="65%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fde047" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <style>
    /* Lightfall 下落流光动画 */
    @keyframes lightfall {
      0% {
        transform: translateY(-200px);
        opacity: 0;
      }
      15% {
        opacity: 0.95;
      }
      85% {
        opacity: 0.95;
      }
      100% {
        transform: translateY(280px);
        opacity: 0;
      }
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.6; filter: drop-shadow(0 0 2px #10b981); }
      50% { opacity: 1; filter: drop-shadow(0 0 8px #10b981); }
    }

    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .beam {
      transform-origin: center;
      animation: lightfall linear infinite;
    }

    .b-1  { animation-duration: 3.2s; animation-delay: 0.0s; }
    .b-2  { animation-duration: 4.5s; animation-delay: 1.1s; }
    .b-3  { animation-duration: 2.8s; animation-delay: 0.4s; }
    .b-4  { animation-duration: 5.0s; animation-delay: 1.8s; }
    .b-5  { animation-duration: 3.6s; animation-delay: 1.3s; }
    .b-6  { animation-duration: 4.2s; animation-delay: 0.2s; }
    .b-7  { animation-duration: 2.9s; animation-delay: 1.6s; }
    .b-8  { animation-duration: 4.8s; animation-delay: 2.2s; }
    .b-9  { animation-duration: 3.8s; animation-delay: 0.7s; }
    .b-10 { animation-duration: 3.3s; animation-delay: 2.0s; }
    .b-11 { animation-duration: 4.4s; animation-delay: 1.2s; }
    .b-12 { animation-duration: 3.5s; animation-delay: 2.6s; }

    .glow-dot {
      animation: pulseGlow 2s ease-in-out infinite;
    }
    .cursor {
      animation: cursorBlink 0.9s infinite;
    }

    /* 风格 C：未来机能几何体 */
    .font-cyber {
      font-family: 'HarmonyOS Sans SC', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', '微软雅黑', 'Segoe UI', sans-serif;
      letter-spacing: 0.04em;
    }
    .font-mono-tag {
      font-family: 'Cascadia Code', 'Consolas', 'HarmonyOS Sans SC', 'Microsoft YaHei', monospace;
      letter-spacing: 0.02em;
    }
  </style>

  <!-- 1. 全覆盖无边框贯通流光雨 -->
  <g id="lightfall-header-streams">
    <g class="beam b-1"><rect x="35" y="0" width="2.5" height="150" rx="1.25" fill="url(#streamCyan)" filter="url(#glow)"/><circle cx="36.25" cy="150" r="3" fill="#00f0ff"/></g>
    <g class="beam b-2"><rect x="95" y="0" width="3.5" height="180" rx="1.75" fill="url(#streamPurple)" filter="url(#glow)"/><circle cx="96.75" cy="180" r="3.5" fill="#c084fc"/></g>
    <g class="beam b-3"><rect x="160" y="0" width="2" height="130" rx="1" fill="url(#streamEmerald)"/><circle cx="161" cy="130" r="2.5" fill="#34d399"/></g>
    <g class="beam b-4"><rect x="235" y="0" width="3" height="170" rx="1.5" fill="url(#streamPink)" filter="url(#glow)"/><circle cx="236.5" cy="170" r="3" fill="#fb7185"/></g>
    <g class="beam b-5"><rect x="315" y="0" width="2.5" height="150" rx="1.25" fill="url(#streamCyan)"/><circle cx="316.25" cy="150" r="2.5" fill="#00f0ff"/></g>
    <g class="beam b-6"><rect x="400" y="0" width="4" height="190" rx="2" fill="url(#streamPurple)" filter="url(#glow)"/><circle cx="402" cy="190" r="4" fill="#a855f7"/></g>
    <g class="beam b-7"><rect x="485" y="0" width="2" height="140" rx="1" fill="url(#streamAmber)"/><circle cx="486" cy="140" r="2.5" fill="#f59e0b"/></g>
    <g class="beam b-8"><rect x="575" y="0" width="3" height="180" rx="1.5" fill="url(#streamEmerald)" filter="url(#glow)"/><circle cx="576.5" cy="180" r="3" fill="#10b981"/></g>
    <g class="beam b-9"><rect x="660" y="0" width="2.5" height="150" rx="1.25" fill="url(#streamCyan)"/><circle cx="661.25" cy="150" r="2.5" fill="#38bdf8"/></g>
    <g class="beam b-10"><rect x="735" y="0" width="3.5" height="180" rx="1.75" fill="url(#streamPurple)" filter="url(#glow)"/><circle cx="736.75" cy="180" r="3.5" fill="#c084fc"/></g>
    <g class="beam b-11"><rect x="805" y="0" width="3" height="160" rx="1.5" fill="url(#streamCyan)" filter="url(#glow)"/><circle cx="806.5" cy="160" r="3" fill="#00f0ff"/></g>
    <g class="beam b-12"><rect x="865" y="0" width="2.5" height="150" rx="1.25" fill="url(#streamPink)"/><circle cx="866.25" cy="150" r="2.5" fill="#fb7185"/></g>
  </g>

  <!-- ==================== 核心大标题与职业定位 (风格 C 未来机能体) ==================== -->
  <g id="header-content">
    <!-- 状态指示胶囊 -->
    <g transform="translate(285, 20)">
      <rect width="330" height="34" rx="17" fill="#ffffff" fill-opacity="0.9" filter="url(#softShadow)"/>
      <circle cx="22" cy="17" r="5" fill="#10b981" class="glow-dot"/>
      <text x="38" y="22" class="font-cyber" font-size="12" font-weight="800" fill="#0f172a" letter-spacing="1">
        LIGHTFALL // FULL BACKGROUND
      </text>
    </g>

    <!-- 主标题 (大字号 44px，极粗未来黑客) -->
    <g transform="translate(450, 102)" text-anchor="middle" filter="url(#textHalo)">
      <text class="font-cyber" font-size="44" font-weight="900" fill="#0f172a">
        Hi, I'm <tspan fill="#0284c7">Mr-吴</tspan> (995william) <tspan font-size="36">⚡</tspan>
      </text>
    </g>

    <!-- 职业副标题 (风格 C 未来机能体，字号 19px 加粗) -->
    <g transform="translate(450, 146)" text-anchor="middle" filter="url(#textHalo)">
      <text class="font-cyber" font-size="19" font-weight="800" fill="#1e293b">
        全栈自由开发工程师 <tspan fill="#8b5cf6">·</tspan> 自动化脚本与运维专精 <tspan fill="#8b5cf6">·</tspan> 2018 至今
      </text>
    </g>

    <!-- 属性标签 (字号 15px 加粗) -->
    <g transform="translate(450, 185)" text-anchor="middle" filter="url(#textHalo)">
      <text class="font-mono-tag" font-size="15" font-weight="700" fill="#334155">
        <tspan fill="#10b981" font-weight="900">➜</tspan> <tspan fill="#0284c7">坐标</tspan>: 远程/自由职业 <tspan fill="#94a3b8">|</tspan> <tspan fill="#0284c7">核心技术</tspan>: Java + Python + Vue <tspan fill="#94a3b8">|</tspan> <tspan fill="#0284c7">信仰</tspan>: Tabs &gt; Spaces <tspan fill="#0284c7" class="cursor">_</tspan>
      </text>
    </g>
  </g>
</svg>
