name: Generate Contribution Snake

on:
  schedule:
    # 每天 UTC 0 点（北京时间早 8 点）自动执行
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Snake SVG with Lightfall Colors
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: 995william
          outputs: |
            assets/github-contribution-grid-snake.svg?color_snake=#0284c7&color_dots=#f1f5f9,#bae6fd,#38bdf8,#818cf8,#a855f7

      - name: Update Lightfall Banner with New Snake Grid
        run: |
          python -c "
          snake = open('assets/github-contribution-grid-snake.svg', encoding='utf-8').read()
          start_s = snake.find('>') + 1
          end_s = snake.rfind('</svg>')
          snake_inner = snake[start_s:end_s]
          banner = open('assets/lightfall-banner.svg', encoding='utf-8').read()
          tag_start = banner.find('<svg x=\"5\" y=\"0\"')
          if tag_start != -1:
              tag_inner_start = banner.find('>', tag_start) + 1
              tag_end = banner.find('</svg>', tag_inner_start)
              new_banner = banner[:tag_inner_start] + snake_inner + banner[tag_end:]
              open('assets/lightfall-banner.svg', 'w', encoding='utf-8').write(new_banner)
          "

      - name: Commit & Push Assets
        uses: EndBug/add-and-commit@v9
        with:
          message: 'chore: auto update contribution snake in lightfall banner [skip ci]'
          add: 'assets/*.svg'
