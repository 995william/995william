name: Generate Contribution Snake

on:
  schedule:
    # 每天 UTC 0 点（北京时间早 8 点）自动执行
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Snake SVG with Lightfall Colors
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: 995william
          outputs: |
            assets/github-contribution-grid-snake.svg?color_snake=#0284c7&color_dots=#f1f5f9,#bae6fd,#38bdf8,#818cf8,#a855f7

      - name: Commit & Push Snake SVG
        uses: EndBug/add-and-commit@v9
        with:
          message: 'chore: auto update contribution snake [skip ci]'
          add: 'assets/*.svg'
